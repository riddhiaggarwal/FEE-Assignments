<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess</title>
    <style>
        .box{
             width:400px;
            height:400px;
            border:2px solid black;
            margin:auto;
            margin-top:160px;
            display:grid;
            grid-template-columns:repeat(4,1fr)
        }

        .childbox{
            background-color:black;
        }
        .white{
            background-color:white;
        }    
    </style>
</head>
<body>
    <div class="box">
        <div class="childbox"></div>
        <div class="white"></div>
        <div class="childbox"></div>
         <div class="white"></div>

        <div class="white"></div>
        <div class="childbox"></div>
         <div class="white"></div>
        <div class="childbox"></div>

        <div class="childbox"></div>
         <div class="white"></div>
        <div class="childbox"></div>
         <div class="white"></div>
        
        <div class="white"></div>
        <div class="childbox"></div>
        <div class="white"></div>
        <div class="childbox"></div>
        
    </div>
</body>
</html>
