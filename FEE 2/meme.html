<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>How's Your Mood?</title>
<style>
  body {
    height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a1a2e;
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
  }

  h1 {
    color: #fff;
    margin-bottom: 24px;
  }

  .moods {
    display: flex;
    gap: 14px;
    margin-bottom: 26px;
  }

  .mood-btn {
    font-size: 34px;
    background: #2c2c54;
    border: none;
    border-radius: 14px;
    padding: 14px 18px;
    cursor: pointer;
  }

  .mood-btn:hover {
    background: #3d3d6b;
  }

  .result {
    max-width: 320px;
    min-height: 60px;
    padding: 18px;
    border-radius: 12px;
    background: #fff8e7;
    color: #333;
    font-size: 17px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>

<h1>How's your mood today?</h1>

<div class="moods">
  <button class="mood-btn" onclick="showMood('😄 Nice! Go annoy someone with your positivity.')">😄</button>
  <button class="mood-btn" onclick="showMood('😢 Aw. Here is a virtual hug, no refunds.')">😢</button>
  <button class="mood-btn" onclick="showMood('🥱 Same. This is basically a personality now.')">🥱</button>
  <button class="mood-btn" onclick="showMood('😤 Deep breaths. Or don;t, chaos is fun too.')">😤</button>
  <button class="mood-btn" onclick="showMood('🥰 Ew......, Just kidding, cute.')">🥰</button>
</div>

<div class="result" id="result">Pick an emoji, I'll judge you accordingly.</div>

<script>
  function showMood(message) {
    document.getElementById('result').textContent = message;
  }
</script>
</body>
</html>
